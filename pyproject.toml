[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "helmet-workbench"
version = "0.1.0"
description = "A local safety-helmet monitoring and employee recognition workbench."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Helmet-Identification contributors" }]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "tensorflow>=2.21,<2.22",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "h5py>=3.11,<4",
  "httpx>=0.28,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
helmet-workbench = "helmet_workbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/helmet_workbench"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test*.py"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
  "ignore:__array__ implementation doesn't accept a copy keyword.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/helmet_workbench/api/app.py" = ["B008"]
"src/helmet_workbench/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
